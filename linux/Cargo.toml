[package]
name = "goreecloud-app-store-dev"
version = "0.1.0"
edition = "2021"
description = "Development Linux client for GoreeCloud App Store"
license = "AGPL-3.0-only"
repository = "https://github.com/GoreeCloud/goreecloud-app-store"

[dependencies]
adw = { package = "libadwaita", version = "0.7" }
gtk = { package = "gtk4", version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
