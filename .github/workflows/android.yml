name: Android bootstrap validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Lint
        run: gradle :app:lintDebug
      - name: Assemble development APK
        run: gradle :app:assembleDebug
      - name: Verify development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          mkdir -p build-evidence
          sha256sum "$APK" | tee build-evidence/app-debug.apk.sha256

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee build-evidence/app-debug.badging.txt

          grep -Fq "package: name='com.goreecloud.appstore'" build-evidence/app-debug.badging.txt
          grep -Fq "application-label:'GoreeCloud App Store'" build-evidence/app-debug.badging.txt
      - name: Upload development APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-app-store-development-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-evidence/app-debug.apk.sha256
            build-evidence/app-debug.badging.txt
          if-no-files-found: error
          retention-days: 14
