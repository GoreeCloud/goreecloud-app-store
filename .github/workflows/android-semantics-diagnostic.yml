name: Android semantics diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  navigation-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve Android SDK and stable emulator image
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          ANDROID_IMAGE="$("$SDKMANAGER" --list --verbose | grep -E '^system-images;android-[0-9]+(-ext[0-9]+)?;google_apis;x86_64$' | sort -V | tail -n 1)"
          test -n "$ANDROID_IMAGE"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_IMAGE=$ANDROID_IMAGE" >> "$GITHUB_ENV"
      - name: Install emulator and verified Gradle
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-36" "$ANDROID_IMAGE"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-9.5.0-bin.zip --output /tmp/gradle-9.5.0-bin.zip
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  /tmp/gradle-9.5.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"
      - name: Build exact development APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Boot exact diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=goreecloud-app-store-semantics
          AVD_ROOT="$HOME/.android/avd"
          AVD_DIR="$AVD_ROOT/$AVD_NAME.avd"
          IMAGE_RELATIVE="${ANDROID_IMAGE//;/\/}/"
          IMAGE_DIR="$SDK_ROOT/$IMAGE_RELATIVE"
          test -f "$IMAGE_DIR/system.img"
          test -f "$IMAGE_DIR/kernel-ranchu"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_ROOT/$AVD_NAME.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/$AVD_NAME.avd
          target=android-36
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=$AVD_NAME
          PlayStore.enabled=false
          abi.type=x86_64
          disk.dataPartition.size=4G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.ramSize=2048
          image.sysdir.1=$IMAGE_RELATIVE
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512
          EOF
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          nohup "$SDK_ROOT/emulator/emulator" -avd "$AVD_NAME" -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics >"$RUNNER_TEMP/semantics-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/semantics-emulator.pid"
          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 150); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then BOOTED=1; break; fi
            sleep 2
          done
          test "$BOOTED" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Dump bottom-navigation semantics
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 390x844
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          adb shell cmd uimode night no
          adb shell am force-stop com.goreecloud.appstore.dev
          adb shell am start -W -n com.goreecloud.appstore.dev/com.goreecloud.appstore.MainActivity | grep -F 'Status: ok'
          sleep 1
          adb shell uiautomator dump /sdcard/app-store-semantics.xml
          adb exec-out cat /sdcard/app-store-semantics.xml > /tmp/app-store-semantics.xml
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/app-store-semantics.xml').getroot()
          bounds_re = re.compile(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]')
          print('=== NAVIGATION SEMANTICS ===')
          for node in root.iter('node'):
              raw = node.attrib.get('bounds', '')
              match = bounds_re.fullmatch(raw)
              if not match:
                  continue
              x1, y1, x2, y2 = map(int, match.groups())
              text = node.attrib.get('text', '')
              desc = node.attrib.get('content-desc', '')
              if y2 >= 680 or text in {'Discover','Apps','Services','Updates','Library'} or desc:
                  print({
                      'text': text,
                      'contentDesc': desc,
                      'class': node.attrib.get('class'),
                      'clickable': node.attrib.get('clickable'),
                      'enabled': node.attrib.get('enabled'),
                      'selected': node.attrib.get('selected'),
                      'focusable': node.attrib.get('focusable'),
                      'bounds': raw,
                  })
          print('=== END NAVIGATION SEMANTICS ===')
          PY
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/semantics-emulator.pid"; then kill "$(cat "$RUNNER_TEMP/semantics-emulator.pid")" >/dev/null 2>&1 || true; fi
