name: Android rendered acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-store-rendered-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-rendered-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record and validate exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/rendered-source-commit.txt
          python3 scripts/validate_glaze_ui_adoption.py | tee build-evidence/rendered-glaze-ui-adoption.txt

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_IMAGE=system-images;android-36;google_apis;x86_64" >> "$GITHUB_ENV"

      - name: Install Android emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-36" "$ANDROID_IMAGE"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-9.5.0-bin.zip --output /tmp/gradle-9.5.0-bin.zip
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  /tmp/gradle-9.5.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Build exact development APK and native test APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Create deterministic App Store emulator
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=goreecloud-app-store-rendered
          AVD_ROOT="$HOME/.android/avd"
          AVD_DIR="$AVD_ROOT/$AVD_NAME.avd"
          IMAGE_RELATIVE="${ANDROID_IMAGE//;/\/}/"
          IMAGE_DIR="$SDK_ROOT/$IMAGE_RELATIVE"
          test -f "$IMAGE_DIR/system.img"
          test -f "$IMAGE_DIR/kernel-ranchu"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_ROOT/$AVD_NAME.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/$AVD_NAME.avd
          target=android-36
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=$AVD_NAME
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=GoreeCloud App Store Rendered Runtime
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=4G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.audioInput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.device.manufacturer=GoreeCloud-CI
          hw.device.name=goreecloud_app_store_rendered
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=2048
          hw.sdCard=no
          image.sysdir.1=$IMAGE_RELATIVE
          runtime.network.latency=none
          runtime.network.speed=full
          skin.dynamic=yes
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512
          EOF
          "$SDK_ROOT/emulator/emulator" -list-avds | grep -Fx "$AVD_NAME"
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi

      - name: Boot and install App Store development APK
        shell: bash
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          EMULATOR_LOG="$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.log"
          nohup "$SDK_ROOT/emulator/emulator" -avd goreecloud-app-store-rendered -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none -camera-front none >"$EMULATOR_LOG" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.pid"
          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 150); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r "$APK_PATH"
          adb shell pm path com.goreecloud.appstore.dev | grep -F 'package:'

      - name: Run Compose-native navigation and category acceptance
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -euo pipefail
          adb shell wm size 390x844
          adb shell wm density 160
          adb shell settings put system font_scale 1.0
          adb shell cmd uimode night no
          gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Restore exact development APK after instrumentation cleanup
        shell: bash
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          adb install -r "$APK_PATH"
          adb shell pm path com.goreecloud.appstore.dev | grep -F 'package:'
          adb shell dumpsys package com.goreecloud.appstore.dev | grep -F 'versionName=0.1.5-dev'

      - name: Run rendered/form-factor acceptance
        shell: bash
        env:
          APP_STORE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_STORE_COMPOSE_NAV_ACCEPTED: "true"
        run: python3 scripts/validate_android_rendered_runtime.py

      - name: Upload rendered acceptance evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-app-store-android-rendered-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            contracts/glaze-ui-adoption.json
            build-evidence/rendered-source-commit.txt
            build-evidence/rendered-glaze-ui-adoption.txt
            .artifacts/android-rendered/**
          if-no-files-found: error
          retention-days: 14

      - name: Preserve emulator diagnostics on failure
        if: failure()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.log" || tail -n 300 "$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.log"
          adb devices -l || true
          adb shell dumpsys activity activities | tail -n 120 || true

      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.pid"; then
            kill "$(cat "$RUNNER_TEMP/goreecloud-app-store-rendered-emulator.pid")" >/dev/null 2>&1 || true
          fi
