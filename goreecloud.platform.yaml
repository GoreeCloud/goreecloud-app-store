      path: .github/workflows/android.yml
      revision: 17432649900bc3b13c8c34ac0c43795d4950605a
      result: passed
      observed_at: "2026-09-04T08:24:34Z"
      notes: Exact-head Development CI passed source verification, branding and GLAZE UI V1.1 source contracts, unit tests, native test compilation, lint, APK assembly, package/version/label checks, Development signing-certificate verification, digest generation, and artifact publication. This is not production or Stable acceptance.
    - id: glaze-ui-v1.1-source-contract-33853132745
      category: glaze-ui
      path: contracts/glaze-ui-adoption.json
      revision: 17432649900bc3b13c8c34ac0c43795d4950605a
