      notes: Repository-local source-contract validation passed for current Stable 1.1.0. Rendered, accessibility, representative-device, Human Visual Excellence, release, and production acceptance remain pending.
  release:
    - id: app-store-0.1.5-dev-artifact-9929156404
      version: "0.1.5-dev"
      revision: 17432649900bc3b13c8c34ac0c43795d4950605a
      path: goreecloud-app-store-development-apk-17432649900bc3b13c8c34ac0c43795d4950605a
      result: candidate
      observed_at: "2026-09-04T08:24:34Z"
      artifact_digest: sha256:a44403a8d342067ad919c380ac86c5e3a97a6a96dd4bd9f0f9cf6d798ec9f270
      notes: GitHub Actions artifact ID 9929156404. This digest identifies the published workflow artifact archive; the Development APK remains non-production.

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - contracts/platform-integrations.json
    - contracts/glaze-ui-adoption.json
    - docs/GLAZE_UI_ADOPTION.md
    - scripts/validate_glaze_ui_adoption.py
    - scripts/validate_branding.py
  blockers:
    - GoreeCloud Manager registration, visibility, and acceptance are not established.
    - Privacy Shield runtime policy and acceptance are not established.
    - Wardveil Security runtime package verification and acceptance are not established.
    - Everkeep backup, clean-target restore, and recovery acceptance are not established.
    - GLAZE UI V1.1 source mapping is present, but complete application-specific rendered, accessibility, supported-form-factor, representative-device, Human Visual Excellence, release, and production acceptance remain outstanding.
    - GoreeCloud Mesh registration, capability publication, event transport, and runtime acceptance are not established.
    - GoreeCloud Identity production authentication, session, entitlement, disablement, and revocation integration are not established.
    - Production catalog delivery, package install/update, service launch, rollback/failure validation, protected production signing and key recovery, deployment, release approval, and Stable qualification remain outstanding.
